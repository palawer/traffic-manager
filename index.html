<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tráfico Menorca</title>
    <link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside class="panel">
      <h1>Tráfico Menorca</h1>

      <p id="importStatus" class="hint" style="display:none"></p>

      <section>
        <h2>Simulación</h2>
        <div class="controls">
          <button id="pauseBtn">⏸ Pausa</button>
          <button id="spawnCarBtn">Spawn coches</button>
          <button id="debugLanesBtn">Debug: OFF</button>
          <button id="clearCarsBtn">Quitar coches</button>
          <button id="clearAllBtn">Reiniciar</button>
        </div>
      </section>

      <p id="status" class="status">Cargando red…</p>
    </aside>

    <main class="stage">
      <div id="map"></div>
      <canvas id="pixi-canvas"></canvas>
    </main>

    <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
    <script src="./pixi.min.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
